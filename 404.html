<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a110d;--card:#121c16;--primary:#CBFF15;--text:#ECECEC;--muted:rgba(160,160,160,.85);--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:40px 16px;font-family:'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--text);text-align:center;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 40%,#000 15%,transparent 65%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 15%,transparent 65%);pointer-events:none}
body::after{content:"";position:fixed;left:50%;top:35%;width:520px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(203,255,21,.18),transparent 65%);filter:blur(40px);pointer-events:none}
main{position:relative;z-index:1;max-width:560px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--text);text-decoration:none;margin-bottom:48px}
.logo span{color:var(--primary)}
.logo svg{color:var(--primary)}
.code{font-size:clamp(96px,22vw,170px);font-weight:900;line-height:.9;letter-spacing:-6px;background:linear-gradient(90deg,#CBFF15,#7CFF4F);-webkit-background-clip:text;background-clip:text;color:transparent}
.term{display:inline-block;margin:26px 0 22px;padding:8px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)}
.term b{color:var(--primary);font-weight:500}
h1{font-size:clamp(24px,4.5vw,34px);font-weight:800;letter-spacing:-.5px;margin-bottom:12px}
p{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:34px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:6px;font-weight:600;font-size:14px;letter-spacing:.6px;text-transform:uppercase;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--primary);color:#000;box-shadow:0 10px 30px -10px rgba(203,255,21,.8)}
.btn-outline{border:1px solid rgba(203,255,21,.5);color:var(--primary)}
</style>
</head>
<body>
<main>
  <a href="/" class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/></svg><b>Carlos <span>André</span></b></a>
  <div class="code">404</div>
  <div class="term">GET <b>esta-pagina</b> → não encontrada</div>
  <h1>Essa página não existe.</h1>
  <p>O link pode estar errado ou a página mudou de lugar. Mas fica tranquilo, o resto do site está aqui.</p>
  <div class="btns">
    <a href="/" class="btn btn-primary">Voltar para o início</a>
    <a href="https://wa.me/5538992584237?text=Oi%20Carlos!%20Vim%20pelo%20seu%20site." class="btn btn-outline" target="_blank" rel="noopener">Falar no WhatsApp</a>
  </div>
</main>
</body>
